name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    # nightly e2e run at 04:17 UTC
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  test:
    name: Unit & component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # etherconn links against libpcap (gopacket/pcap), so the headers are
      # needed to build and link even though the tests never open a pcap handle.
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  e2e:
    name: E2E (network namespace)
    # root is required to create a netns and raw sockets; run nightly or on demand
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Run e2e tests
        run: sudo -E env "PATH=$PATH" go test -tags e2e -count=1 -run '^TestE2E' -v .
